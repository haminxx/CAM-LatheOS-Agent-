name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff==0.7.2 pytest==8.3.3 pytest-asyncio==0.24.0

      - name: Ruff
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Syntax compile
        run: python -m compileall -q app

      - name: Pytest
        env:
          ENV: dev
          ALLOW_UNVERIFIED_TOKENS: "true"
        run: pytest -q

  docker:
    runs-on: ubuntu-24.04
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Login to ECR
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image (ECR)
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/cam-proxy:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/cam-proxy:latest

      - name: Build image (no ECR — sanity only)
        if: ${{ vars.AWS_ROLE_TO_ASSUME == '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: cam-proxy:ci
